[workspace]
resolver = "2"
members = [
    "crates/afflictio-ipc",
    "crates/afflictio-hal",
    "crates/afflictio-init",
    "crates/afflictio-session",
    "crates/afflictio-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/mel0k1/Afflictio"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
signal-hook = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
