[[modules]]
name = "evdev"

[[modules]]
name = "virtio_gpu"

[[modules]]
name = "virtio_input"

[[modules]]
name = "sun4i_drm"

[[mounts]]
source = "binder"
target = "/dev/binderfs"
fstype = "binder"

[[services]]
name = "lioatd"
argv = ["/bin/lioatd"]
respawn = true

[[services]]
name = "tiosessd"
argv = ["/bin/tiosessd"]
respawn = true

[[services]]
name = "tiocompd"
argv = ["/bin/tiocompd"]
respawn = false

[[services]]
name = "probe"
argv = ["/bin/probe.sh"]
respawn = false
